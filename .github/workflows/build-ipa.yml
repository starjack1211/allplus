name: Build AllPlus IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project and configure Google
        run: |
          xcodegen generate
          python3 scripts/configure.py
      - name: Select available iPhone simulator
        run: |
          xcrun simctl list devices available --json > /tmp/simulators.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('/tmp/simulators.json'))
          devices = [d for runtime, group in data['devices'].items() if 'iOS' in runtime for d in group if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not devices:
              raise SystemExit('No iPhone simulator installed on this runner')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('SIMULATOR_ID=' + devices[0]['udid'] + '\n')
          PY
      - name: Run tests
        run: >-
          xcodebuild test -project AllPlus.xcodeproj -scheme AllPlus
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -derivedDataPath build-sim -resultBundlePath TestResults.xcresult
          CODE_SIGNING_ALLOWED=NO
      - name: Build iPhone app
        run: >-
          xcodebuild build -project AllPlus.xcodeproj -scheme AllPlus
          -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA for iLoader
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/AllPlus.app package/Payload/
          cd package
          zip -qry ../AllPlus-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AllPlus-iLoader
          path: AllPlus-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AllPlus-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
